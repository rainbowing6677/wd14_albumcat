name: build-apk

# Build an installable debug APK of the Aves fork.
#
# Why this exists: the repo's own `tools\aves_build.ps1` needs JDK 21 + Android
# SDK + Flutter 3.47 on a Windows box, which is exactly what a contributor
# without an Android toolchain does not have. The build itself is one command,
# so it can run here instead and hand back an APK.
#
# It is debug-signed on purpose: debug signing needs no keystore, installs on
# any device, and is the right thing for "put it on my phone and look at it".
# A release build would need the keystore from key_template.properties.

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Flutter target platform (android-arm64 for a real phone, android-x64 for an emulator)'
        required: false
        default: 'android-arm64'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aves

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # The runner image already ships an Android SDK at
      # /usr/local/lib/android/sdk, and Flutter finds it on its own.
      # android-actions/setup-android@v3 is deliberately NOT used: it tries to
      # install the `tools` package, which has been dropped from the SDK repo,
      # so it fails with "Failed to find package 'tools'".
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      # The jni module pulled in by a Flutter plugin configures its native
      # build with CMake 3.22.1, and the runner image does not ship it:
      #   [CXX1300] CMake '3.22.1' was not found in SDK, PATH, or by cmake.dir
      # The NDK (r28c) Gradle downloads on its own; CMake it does not.
      - name: Install CMake 3.22.1
        run: |
          # sdkmanager is not on PATH; it lives under cmdline-tools/<ver>/bin.
          # Find whichever version the runner image shipped with.
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKMGR"
          "$SDKMGR" --install "cmake;3.22.1"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk
        run: |
          flutter build apk --debug \
            --flavor libre \
            --target-platform ${{ inputs.target_platform }} \
            -t lib/main_libre.dart

      - name: Show what came out
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: aves-libre-debug-${{ inputs.target_platform }}
          path: aves/build/app/outputs/flutter-apk/app-libre-debug.apk
          if-no-files-found: error

      # Artifacts expire (this repo's were gone within hours), and their zip
      # endpoint does not support Range, so a 150 MB download that drops has to
      # start over. A release asset has neither problem: permanent URL, resumable.
      - name: Publish to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-libre-debug.apk \
            --title "Aves libre debug APK · build ${{ github.run_number }}" \
            --notes "Debug-signed, ${{ inputs.target_platform }}. Install on a real phone (allow unknown sources). Includes the OCR work from this week: text search, incremental indexing, watermark-sized uploads." \
            || gh release upload "$TAG" build/app/outputs/flutter-apk/app-libre-debug.apk --clobber
